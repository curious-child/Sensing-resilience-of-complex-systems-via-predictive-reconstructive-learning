out_dir: results/SIS/Recon_AE_model_trainone

net:
  degree_loss_weight: [1.0,0.0]
  lr: [0.001,0.0001]
  device: ["cuda:3"]
  edge_decoder_type: ["Hadamard_MLPPredictor"]
  hidden_dim: [ 128,256 ]
  neg_samples_ratio: [1.0]
  Dy_transformer:
    dataset_nf: [1]
    windows: [10]
    output_attention: [ False ]
    dropout: [ 0.05 ]
    factor: [ 3 ]
    n_heads: [ 8 ]
    d_ff: [ 256 ]
    activation: [ gelu ]
    e_layers: [ 4 ]
    d_layers: [ 2 ]
    p_hidden_dims: [ [ 64, 64 ] ]
    p_hidden_layers: [ 2 ]



